<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>الخفاجي AI — CloudAssistant6</title>
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='18' fill='%230b74de'/><circle cx='60' cy='35' r='20' fill='%23ffffff'/><rect x='38' y='64' width='44' height='26' rx='6' fill='%23ffffff'/><circle cx='50' cy='34' r='3' fill='%230b74de'/><circle cx='70' cy='34' r='3' fill='%230b74de'/></svg>" />
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0b74de">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/icons/robot-192.svg">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <h1>الخفاجي AI</h1>
        <p>مساعدك الروبوتي لترجمة الشاشة فوراً</p>
      </header>

      <main class="site-main">
        <p>اضغط على الروبوت العائم في الزاوية للتحكم بميزة ترجمة الشاشة فوراً.</p>

        <section class="demo-content">
          <h2>مثال نص قابل للترجمة</h2>
          <p>
            هذا نص عربي تجريبي. Try some English text as well. يمكنك تجربة صور ونصوص
            من صفحات مختلفة.
          </p>
        </section>
      </main>

      <!-- Floating robot button -->
      <button id="robotBtn" class="floating-robot" aria-label="الخفاجي AI">
        <svg width="44" height="44" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden>
          <defs>
            <linearGradient id="g1" x1="0" x2="1"><stop offset="0%" stop-color="#0b74de"/><stop offset="100%" stop-color="#2bb6ff"/></linearGradient>
          </defs>
          <rect width="256" height="256" rx="36" fill="url(%23g1)"/>
          <circle cx="128" cy="88" r="42" fill="#ffffff"/>
          <rect x="86" y="120" width="84" height="56" rx="12" fill="#ffffff"/>
          <circle cx="108" cy="82" r="6" fill="#0b74de"/>
          <circle cx="148" cy="82" r="6" fill="#0b74de"/>
          <path d="M118 104h20" stroke="#0b74de" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </button>

      <div id="robotPanel" class="robot-panel hidden" role="dialog" aria-label="الخفاجي AI Panel">
        <div class="robot-panel-header">
          <div style="display:flex; align-items:center">
            <div class="robot-face" aria-hidden>
              <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="1.8" fill="#0b74de"/><circle cx="16" cy="8" r="1.8" fill="#0b74de"/></svg>
            </div>
            <strong>الخفاجي AI</strong>
          </div>
          <button id="closePanel" class="close-btn" aria-label="close">×</button>
        </div>

        <div class="robot-panel-body">
          <div id="translator">
            <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px">
              <button id="translateBtn" class="primary">ترجمة الشاشة فوراً</button>
              <label style="font-size:13px; display:flex; align-items:center; gap:6px"><input id="ttsToggle" type="checkbox" checked/> قراءة صوتية</label>
            </div>
            <div id="status" class="status"></div>
            <div id="result" class="result"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- CDN libs -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('ServiceWorker registration successful with scope: ', reg.scope);
          }, function(err) {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
    <script src="/app.js"></script>
  </body>
</html>
